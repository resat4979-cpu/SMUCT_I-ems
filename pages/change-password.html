<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password | SMUCT i-EMS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="auth">
<div class="shape s1"></div><div class="shape s4"></div><div class="shape s5"></div><div class="shape s7"></div>
<form class="auth-card wide" id="f" autocomplete="off">
  <img class="logo" src="../assets/img/logo.png" alt="SMUCT">
  <h2>Change Password Form</h2>
  <div class="guide"><b>New Password Guide:</b>
    <div id="r1" class="bad">&#10006; One upper case letter (A-Z)</div><div id="r2" class="bad">&#10006; One lower case letter (a-z)</div>
    <div id="r3" class="bad">&#10006; One numeric digit (0-9)</div><div id="r4" class="bad">&#10006; One special symbol (!@#$%^&amp;*?_~)</div>
    <div id="r5" class="bad">&#10006; Must be 8 characters minimum long.</div></div>
  <label>Current Password :</label><input id="cur" type="password" placeholder="Current Password">
  <label>New Password:</label><input id="np" type="password" placeholder="New Password">
  <div style="text-align:left;font-size:12px;margin-top:3px">Password Strength:</div><div class="strength"><i id="bar"></i></div>
  <label>Confirm New Password:</label><input id="cp" type="password" placeholder="Confirm New Password">
  <div class="err" id="msg"></div>
  <div class="row-btns"><a href="dashboard.html">Home</a><a href="#" class="out" onclick="logout();return false">Logout</a><button type="submit" class="save" id="save" disabled>Change Password</button></div>
  <div class="by">Developed &amp; Maintained by<img src="../assets/img/vendor.png" alt="Pipilika Soft"></div>
</form>
<script src="../data/config.js"></script>
<script src="../data/menu.js"></script>
<script src="../data/student.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/pages/change-password.js"></script>
</body>
</html>
